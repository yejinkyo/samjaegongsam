<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 타래</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/landing.css">
  <link rel="stylesheet" href="assets/auth.css">
</head>
<body data-page="login">
  <main class="auth">

    <a class="auth__brand" href="index.html">
      <span class="lp-mark" aria-hidden="true"></span>
      <span class="auth__brand-name">타래</span>
    </a>

    <section class="sheet">
      <span class="sheet__tab">로그인</span>
      <div class="sheet__body">
        <div>
          <h1 class="sheet__title">다시 오셨네요</h1>
          <p class="sheet__desc">정리해 둔 사건을 이어서 볼 수 있어요.</p>
        </div>

        <form class="auth__form" id="login-form" novalidate>
          <div class="field">
            <label for="username">아이디</label>
            <input id="username" name="username" type="text" inputmode="latin" autocomplete="username" required>
          </div>

          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <p class="field__hint" data-hint="password"></p>
          </div>

          <button class="lp-btn lp-btn--primary" type="submit">로그인하기</button>
        </form>
      </div>
    </section>

    <p class="auth__switch">아직 계정이 없으신가요? <a href="signup.html">회원가입</a></p>
    <p class="auth__demo">지금은 화면만 있는 데모예요. 입력한 내용은 어디에도 보내지 않고, 이 브라우저에도 남기지 않습니다.</p>

  </main>
  <script src="assets/auth.js"></script>
</body>
</html>
