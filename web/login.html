<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 타래</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gugi&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/landing.css">
  <link rel="stylesheet" href="assets/auth.css">
</head>
<body data-page="login">
  <main class="auth">

    <a class="auth__brand" href="index.html">
      <img class="lp-mark" src="assets/logo-light.png" alt="" width="34" height="34">
      <span class="auth__brand-name">타래</span>
    </a>

    <section class="sheet">
      <h1 class="sheet__tab">로그인</h1>
      <div class="sheet__body">
        <p class="sheet__demo">데모 계정 · 아이디 <b>삼재공삼</b> / 비밀번호 <b>삼재공삼</b></p>

        <form class="auth__form" id="login-form" novalidate>
          <div class="field">
            <label for="username">아이디</label>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="삼재공삼" required>
          </div>

          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="삼재공삼" required>
            <p class="field__hint" data-hint="password"></p>
          </div>

          <button class="lp-btn lp-btn--primary" type="submit">로그인하기</button>
        </form>
      </div>
    </section>

    <p class="auth__switch">아직 계정이 없으신가요? <a href="signup.html">회원가입</a></p>
    <p class="auth__demo">지금은 화면만 있는 데모예요. 입력한 내용은 어디로도 보내지 않습니다. 가입한 계정은 이 브라우저 안에만 있어서 다른 기기에서는 보이지 않고, 비밀번호는 그대로 저장하지 않습니다.</p>

  </main>
  <script src="assets/auth.js"></script>
</body>
</html>
