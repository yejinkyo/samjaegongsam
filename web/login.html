<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 타래</title>
  <!-- 링크를 붙였을 때 보이는 미리보기 (카카오톡 · 슬랙 · 제출 페이지) -->
  <meta name="description" content="흩어진 사건 기록을 하나의 시간축으로 정리하고, 어긋난 곳과 비어 있는 곳을 짚어 다음 행동을 알려 드려요.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="타래">
  <meta property="og:title" content="로그인 · 타래">
  <meta property="og:description" content="흩어진 사건 기록을 하나의 시간축으로 정리하고, 어긋난 곳과 비어 있는 곳을 짚어 다음 행동을 알려 드려요.">
  <meta property="og:url" content="https://tarae-kr.vercel.app/login.html">
  <meta property="og:image" content="https://tarae-kr.vercel.app/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gugi&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/landing.css">
  <link rel="stylesheet" href="assets/auth.css">
</head>
<body data-page="login">
  <main class="auth">

    <a class="auth__brand" href="index.html">
      <img class="lp-mark" src="assets/logo-light.png" alt="" width="34" height="34">
      <span class="auth__brand-name">타래</span>
    </a>

    <section class="sheet">
      <h1 class="sheet__tab">로그인</h1>
      <div class="sheet__body">
        <p class="sheet__demo">데모 계정 · 아이디 <b>삼재공삼</b> / 비밀번호 <b>삼재공삼</b></p>

        <form class="auth__form" id="login-form" novalidate>
          <div class="field">
            <label for="username">아이디</label>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="삼재공삼" required>
          </div>

          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="삼재공삼" required>
            <p class="field__hint" data-hint="password"></p>
          </div>

          <button class="lp-btn lp-btn--primary" type="submit">로그인하기</button>
        </form>

        <a class="lp-btn lp-btn--ghost" href="cases.html" data-browse>로그인 없이 둘러보기</a>
      </div>
    </section>

    <p class="auth__switch">아직 계정이 없으신가요? <a href="signup.html">회원가입</a></p>
    <p class="auth__demo">데모 화면입니다.</p>

  </main>
  <script src="assets/browse.js"></script>
  <script src="assets/auth.js"></script>
</body>
</html>
