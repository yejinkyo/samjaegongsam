<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 · 타래</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gugi&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/landing.css">
  <link rel="stylesheet" href="assets/auth.css">
</head>
<body data-page="signup">
  <main class="auth">

    <a class="auth__brand" href="index.html">
      <img class="lp-mark" src="assets/logo-light.png" alt="" width="34" height="34">
      <span class="auth__brand-name">타래</span>
    </a>

    <section class="sheet">
      <span class="sheet__tab">회원가입</span>
      <div class="sheet__body">
        <div>
          <h1 class="sheet__title">아이디와 비밀번호를 만들어 주세요</h1>
          <p class="sheet__desc">사건 자료는 본인만 볼 수 있습니다.</p>
        </div>

        <form class="auth__form" id="signup-form" novalidate>
          <div class="field">
            <label for="username">아이디</label>
            <input id="username" name="username" type="text" inputmode="latin" autocomplete="username"
                   placeholder="영문 · 숫자 4자 이상" minlength="4" required>
            <p class="field__hint" data-hint="username">영문과 숫자를 섞어 4자 이상으로 만들어 주세요.</p>
          </div>

          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="new-password"
                   placeholder="8자 이상" minlength="8" required>
            <p class="field__hint" data-hint="password">8자 이상으로 만들어 주세요.</p>
          </div>

          <div class="field">
            <label for="birth">생년월일</label>
            <input id="birth" name="birth" type="date" autocomplete="bday" required>
            <p class="field__hint" data-hint="birth">본인 확인이 필요한 절차에서만 씁니다.</p>
          </div>

          <button class="lp-btn lp-btn--primary" type="submit">가입하기</button>
        </form>

        <div class="social">
          <p class="social__label">간편 회원가입</p>
          <div class="social__buttons">
            <a class="social__btn social__btn--kakao" href="#" aria-label="카카오톡으로 간편 회원가입">
              <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#3c1e1e" d="M12 4.5c-4.4 0-8 2.8-8 6.2 0 2.2 1.5 4.1 3.7 5.2l-.9 3.3c-.1.3.2.5.5.3l3.9-2.6c.3 0 .6.1.8.1 4.4 0 8-2.8 8-6.3S16.4 4.5 12 4.5z"/>
              </svg>
            </a>
            <a class="social__btn social__btn--naver" href="#" aria-label="네이버로 간편 회원가입">
              <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#fff" d="M4 4h5.4l5 7.4V4H20v16h-5.4l-5-7.4V20H4z"/>
              </svg>
            </a>
            <a class="social__btn social__btn--google" href="#" aria-label="구글로 간편 회원가입">
              <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285f4" d="M21.6 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.2z"/>
                <path fill="#34a853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.7-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/>
                <path fill="#fbbc05" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2z"/>
                <path fill="#ea4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.4 3-4.1 5.6-4.1z"/>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </section>

    <p class="auth__switch">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
    <p class="auth__demo">지금은 화면만 있는 데모예요. 입력한 내용은 어디에도 보내지 않고, 이 브라우저에도 남기지 않습니다.</p>

  </main>
  <script src="assets/auth.js"></script>
</body>
</html>
