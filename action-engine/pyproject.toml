[project]
name = "action-engine"
version = "0.1.0"
description = "사건 상태 코드 매핑·우선순위 판정 엔진 (기능 2 다음 행동 강령)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/action_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"src/action_engine/__init__.py" = ["F401"]
