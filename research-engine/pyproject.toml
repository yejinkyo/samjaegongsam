[project]
name = "research-engine"
version = "0.1.0"
description = "사건 자료 수집·추출·타임라인·모순/공백 탐지 파이프라인 (기능 1 재구성 엔진)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "korean-lunar-calendar>=0.3.1",
]

[project.optional-dependencies]
# 실제 이미지 OCR (Tesseract 바이너리 + kor 언어팩 별도 설치 필요)
ocr = ["pytesseract>=0.3.10", "Pillow>=10"]
# 파인튜닝된 한국어 NLI 모델을 붙일 때
nli = ["transformers>=4.40", "torch>=2.2"]

[project.scripts]
research-engine = "research_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
# 날짜는 한국 시간 기준 naive datetime으로 다룬다 (DTZ 제외)
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"src/research_engine/schema/__init__.py" = ["F401"]
