# web/ 을 GitHub Pages 로 올린다.
#
# 빌드 도구가 없어서 옮기기만 하면 된다 — web/ 안의 파일이 그대로 사이트가 된다.
# 화면 데이터(web/data/cases.js)는 action-engine/tools/export_web.py 가 미리 만들어
# 커밋해 둔 것이라 여기서 파이썬을 돌리지 않는다. 엔진을 고치면 그 스크립트를 다시
# 돌려 커밋해야 사이트에도 반영된다.
name: 화면 배포

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:      # 손으로도 돌릴 수 있게 — 발표 직전에 다시 올릴 일이 있다

permissions:
  contents: read
  pages: write
  id-token: write

# 올리는 중에 또 올리지 않는다. 뒤에 온 것이 이긴다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 커밋된 화면 데이터가 있는지 확인
        run: test -f web/data/cases.js || (echo "web/data/cases.js 가 없습니다 — export_web.py 를 돌려 커밋하세요" && exit 1)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
